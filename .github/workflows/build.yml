name: Build test scenes

# Builds the Godot test scene for the web and publishes every test scene to the
# gh-pages branch, together with the build log, so the result can be opened on a
# phone and the log can be read without signing in.

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output folder
        run: |
          mkdir -p public/godot
          cp -r site/. public/
          touch public/.nojekyll
          echo "commit ${GITHUB_SHA} on ${GITHUB_REF_NAME} at $(date -u +%FT%TZ)" > public/build-log.txt

      - name: Download Godot and its export templates
        id: godot
        run: |
          set -o pipefail
          {
            TAG=$(gh release view --repo godotengine/godot --json tagName -q .tagName)
            echo "Godot release: ${TAG}"
            gh release download "${TAG}" --repo godotengine/godot \
              --pattern "Godot_v${TAG}_linux.x86_64.zip" \
              --pattern "Godot_v${TAG}_export_templates.tpz"
            unzip -q "Godot_v${TAG}_linux.x86_64.zip"
            mv "Godot_v${TAG}_linux.x86_64" godot
            chmod +x godot
            TEMPLATES="${HOME}/.local/share/godot/export_templates/${TAG/-/.}"
            mkdir -p "${TEMPLATES}"
            unzip -q "Godot_v${TAG}_export_templates.tpz"
            mv templates/* "${TEMPLATES}/"
            ls "${TEMPLATES}" | grep -i web || true
            ./godot --version
            echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          } 2>&1 | tee -a public/build-log.txt

      - name: Import and export the Godot scene for the web
        id: export
        run: |
          set -o pipefail
          {
            echo "--- import ---"
            ./godot --headless --path godot-scene --import || echo "import exit code $?"
            echo "--- export ---"
            ./godot --headless --path godot-scene --export-release "Web" "$(pwd)/public/godot/index.html"
            echo "--- exported files ---"
            ls -la public/godot
          } 2>&1 | tee -a public/build-log.txt

      - name: Record the result
        if: always()
        run: |
          OK=false
          if [ -f public/godot/index.html ] && ls public/godot/*.wasm >/dev/null 2>&1; then OK=true; fi
          printf '{"commit":"%s","branch":"%s","godot":"%s","download":"%s","export":"%s","godotBuildPresent":%s,"time":"%s"}\n' \
            "${GITHUB_SHA}" "${GITHUB_REF_NAME}" "${{ steps.godot.outputs.tag }}" "${{ steps.godot.outcome }}" "${{ steps.export.outcome }}" "${OK}" "$(date -u +%FT%TZ)" \
            > public/status.json
          cat public/status.json

      - name: Publish to the gh-pages branch
        if: always()
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
